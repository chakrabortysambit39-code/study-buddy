<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Mode • Study Buddy</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="quiz-shell"><a class="back-link" href="{{ url_for('home') }}">← Back</a><section class="hero-card"><p class="eyebrow">V7 • FOCUS MODE</p><h1>Deep Focus ⏱️</h1><p>Choose a session, put distractions away, and log the time when you're done.</p><form method="POST" class="generator-grid"><label>Session<select name="minutes"><option>25</option><option>50</option><option>60</option><option>90</option></select></label><button class="primary-button" type="submit">✅ Complete Session</button></form>{% if message %}<p class="answer-text">{{ message }}</p>{% endif %}</section><section class="stats-grid"><div class="stat-card"><span>⏱️ Focus</span><strong>{{ summary.minutes }}</strong><small>minutes</small></div><div class="stat-card"><span>🎯 Sessions</span><strong>{{ summary.sessions }}</strong><small>completed</small></div></section></main></body></html>
