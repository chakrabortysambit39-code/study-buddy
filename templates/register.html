<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account • Study Buddy</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><main class="quiz-shell"><a class="back-link" href="{{ url_for('home') }}">← Back</a><section class="hero-card"><p class="eyebrow">V5 • ACCOUNT</p><h1>Create your Study Buddy account 🚀</h1><p>Your notes and progress will belong to your account.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="error-card question-card">{{ message }}</div>{% endfor %}{% endwith %}<form method="POST" class="generator-grid"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="6" required autocomplete="new-password"></label><button class="primary-button" type="submit">Create Account →</button></form><p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></section></main></body></html>
