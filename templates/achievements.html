<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Achievements • Study Buddy</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="quiz-shell"><a class="back-link" href="{{ url_for('home') }}">← Back</a><section class="hero-card"><p class="eyebrow">V7 • ACHIEVEMENTS</p><h1>Achievements 🏆</h1><p>Small wins add up.</p></section>{% if achievements %}{% for a in achievements %}<section class="question-card"><h2>🏆 {{ a.title }}</h2><p class="answer-text">{{ a.description }}</p><strong>+{{ a.xp }} XP</strong></section>{% endfor %}{% else %}<section class="question-card"><p class="answer-text">Your first achievement is waiting. Complete a quiz or focus session!</p></section>{% endif %}</main></body></html>
