<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Face Tutor • Study Buddy</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.face-shell{max-width:1100px;margin:30px auto;padding:20px}.face-card{background:#fff;border-radius:28px;padding:28px;box-shadow:0 15px 45px rgba(0,0,0,.08)}
.tutor-stage{display:grid;grid-template-columns:360px 1fr;gap:30px;align-items:center}.avatar-wrap{text-align:center}
.avatar{width:270px;height:300px;margin:auto;position:relative;filter:drop-shadow(0 18px 22px rgba(0,0,0,.16))}
.head{position:absolute;left:35px;top:20px;width:200px;height:225px;border-radius:47% 47% 44% 44%;background:radial-gradient(circle at 40% 35%,#ffe1c4 0 16%,#efbd96 52%,#d99670 100%);box-shadow:inset -12px -16px 22px rgba(100,50,20,.12)}
.hair{position:absolute;left:31px;top:7px;width:208px;height:100px;background:linear-gradient(145deg,#15191f,#39414d);border-radius:58% 55% 35% 35%;z-index:3;box-shadow:inset -15px -8px 12px rgba(0,0,0,.25)}
.ear{position:absolute;top:112px;width:28px;height:55px;border-radius:50%;background:#e4aa83}.ear.l{left:23px}.ear.r{right:23px}
.eye{position:absolute;top:103px;width:34px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.18);z-index:4}.eye.l{left:72px}.eye.r{right:72px}.eye:after{content:'';position:absolute;left:12px;top:4px;width:12px;height:12px;background:#25344a;border-radius:50%}
.brow{position:absolute;top:91px;width:48px;height:7px;background:#47352e;border-radius:8px;z-index:4}.brow.l{left:65px;transform:rotate(-4deg)}.brow.r{right:65px;transform:rotate(4deg)}
.nose{position:absolute;left:118px;top:120px;width:28px;height:58px;border-right:4px solid rgba(120,70,45,.22);border-bottom:5px solid rgba(120,70,45,.22);border-radius:0 0 25px 0;z-index:4}
.mouth{position:absolute;left:101px;bottom:47px;width:67px;height:12px;border-radius:0 0 40px 40px;background:#8c4050;z-index:4;transition:.12s;box-shadow:inset 0 3px 0 rgba(255,255,255,.2)}
.avatar.speaking .mouth{height:30px;border-radius:50%;animation:talk .18s infinite alternate}.avatar.speaking .head{animation:bob 1s infinite alternate}
.body{position:absolute;left:4px;bottom:-5px;width:262px;height:115px;border-radius:120px 120px 20px 20px;background:linear-gradient(145deg,#253e65,#5d79a7);z-index:-1}
@keyframes talk{to{transform:scaleY(.45)}}@keyframes bob{to{transform:translateY(-3px)}}
.lesson-box{min-height:220px;background:#f7f9fc;border-radius:20px;padding:24px}.lesson-text{font-size:19px;line-height:1.7;white-space:pre-wrap}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.controls button,.controls select,.controls input{padding:12px 15px;border-radius:12px;border:1px solid #d7dce5;background:#fff}.primary{background:#315efb!important;color:white;border:0!important;cursor:pointer}.talk-btn{background:#eaf8ef!important;border-color:#8ed3a5!important;cursor:pointer}.status{margin-top:12px;font-size:14px;color:#657084}.transcript{margin-top:10px;color:#536070;font-style:italic;min-height:22px}
@media(max-width:800px){.tutor-stage{grid-template-columns:1fr}.avatar{transform:scale(.88);margin-bottom:-30px}}
</style></head>
<body><main class="face-shell"><a class="back-link" href="{{ url_for('home') }}">← Back</a><section class="face-card"><p class="eyebrow">V8 • AI FACE TUTOR</p><h1>Meet your AI Teacher 👨‍🏫</h1><p>Ask a question naturally. When you start talking, the teacher stops speaking immediately and listens.</p>
<div class="tutor-stage"><div class="avatar-wrap"><div id="avatar" class="avatar"><div class="body"></div><div class="ear l"></div><div class="ear r"></div><div class="head"><div class="hair"></div><span class="brow l"></span><span class="brow r"></span><span class="eye l"></span><span class="eye r"></span><span class="nose"></span><span class="mouth"></span></div></div><div id="status" class="status">Ready to teach</div><div id="transcript" class="transcript"></div></div>
<div><div class="controls"><select id="grade">{% for g in range(1,13) %}<option value="{{g}}" {% if g==7 %}selected{% endif %}>Grade {{g}}</option>{% endfor %}</select><select id="subject"><option>Science</option><option>Maths</option><option>English</option><option>French</option><option>Social Science</option><option>Computer</option></select><input id="topic" placeholder="Topic, e.g. Water Cycle" style="flex:1;min-width:210px"><button class="primary" onclick="startLesson()">▶ Start Teaching</button></div>
<div class="lesson-box" style="margin-top:18px"><div id="lesson" class="lesson-text">Hi! I'm your Study Buddy teacher. Pick a topic and I'll teach it step by step.</div></div>
<div class="controls"><button class="talk-btn" id="talkBtn" onclick="startListening()">🎤 Talk to Teacher</button><button onclick="speakCurrent()">🔊 Speak</button><button onclick="stopSpeaking()">⏹ Stop</button><button onclick="askNext()">🙋 Explain More</button></div></div></div></section></main>
<script>
let currentText='';
let recognition=null;
let listening=false;
const avatar=document.getElementById('avatar'),statusEl=document.getElementById('status'),lesson=document.getElementById('lesson'),transcript=document.getElementById('transcript'),talkBtn=document.getElementById('talkBtn');
function stopSpeaking(){if('speechSynthesis' in window)speechSynthesis.cancel();avatar.classList.remove('speaking');statusEl.textContent='Listening paused';}
function speak(text){if(!text)return;stopSpeaking();const u=new SpeechSynthesisUtterance(text);u.rate=.94;u.pitch=1.02;u.onstart=()=>{avatar.classList.add('speaking');statusEl.textContent='Teaching… 🔊'};u.onend=()=>{avatar.classList.remove('speaking');statusEl.textContent='Ready for your question'};u.onerror=()=>{avatar.classList.remove('speaking');statusEl.textContent='Voice unavailable — you can still read the lesson'};speechSynthesis.speak(u)}
function speakCurrent(){speak(currentText)}
function setupRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const r=new SR();r.lang='en-IN';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;r.onstart=()=>{listening=true;stopSpeaking();talkBtn.textContent='🛑 Listening…';statusEl.textContent='Listening — talk naturally 🎤';transcript.textContent='';};r.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++){text+=e.results[i][0].transcript;if(e.results[i].isFinal){transcript.textContent='You: '+text;handleSpokenQuestion(text);}}};r.onerror=e=>{listening=false;talkBtn.textContent='🎤 Talk to Teacher';statusEl.textContent=e.error==='not-allowed'?'Microphone permission was blocked.':'Voice input error: '+e.error};r.onend=()=>{listening=false;talkBtn.textContent='🎤 Talk to Teacher';};return r}
async function startListening(){if(!recognition)recognition=setupRecognition();if(!recognition){statusEl.textContent='Voice input is not supported in this browser. Try Chrome or Edge.';return}if(listening){recognition.stop();return}stopSpeaking();try{recognition.start()}catch(e){}}
async function handleSpokenQuestion(text){if(!text.trim())return;stopSpeaking();try{const d=await call('/api/ai-face/teach',{grade:document.getElementById('grade').value,subject:document.getElementById('subject').value,prompt:text});currentText=d.answer;lesson.textContent=currentText;speak(currentText)}catch(e){statusEl.textContent=e.message;lesson.textContent=e.message}}
async function call(url,body){statusEl.textContent='Thinking… 🤔';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
async function startLesson(){const topic=document.getElementById('topic').value.trim();if(!topic){alert('Enter a topic first.');return}stopSpeaking();try{const d=await call('/api/ai-face/lesson',{grade:document.getElementById('grade').value,subject:document.getElementById('subject').value,topic});currentText=d.answer;lesson.textContent=currentText;speak(currentText)}catch(e){statusEl.textContent=e.message;lesson.textContent=e.message}}
async function askNext(){if(!currentText)return startLesson();stopSpeaking();try{const d=await call('/api/ai-face/teach',{grade:document.getElementById('grade').value,subject:document.getElementById('subject').value,prompt:'Continue teaching this topic more deeply. Use a different simple example, then ask me one question to check my understanding.'});currentText=d.answer;lesson.textContent=currentText;speak(currentText)}catch(e){statusEl.textContent=e.message}}
</script></body></html>
