<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Face Tutor • Study Buddy</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.face-shell{max-width:1050px;margin:30px auto;padding:20px}.face-card{background:#fff;border-radius:28px;padding:28px;box-shadow:0 15px 45px rgba(0,0,0,.08)}
.tutor-stage{display:grid;grid-template-columns:340px 1fr;gap:30px;align-items:center}.avatar-wrap{text-align:center}.avatar{width:250px;height:250px;margin:auto;border-radius:50%;background:linear-gradient(145deg,#eef5ff,#dce8ff);position:relative;box-shadow:inset 0 -15px 30px rgba(0,0,0,.06)}
.hair{position:absolute;left:40px;top:20px;width:170px;height:75px;background:#26364a;border-radius:90px 90px 35px 35px}.face{position:absolute;left:48px;top:62px;width:154px;height:145px;background:#f4c7a1;border-radius:48% 48% 45% 45%}.eye{position:absolute;top:62px;width:14px;height:18px;background:#243044;border-radius:50%}.eye.l{left:42px}.eye.r{right:42px}.mouth{position:absolute;left:61px;bottom:31px;width:32px;height:10px;border-radius:0 0 30px 30px;background:#8b4050;transition:.15s}.avatar.speaking .mouth{height:25px;border-radius:50%;animation:talk .22s infinite alternate}.avatar.speaking{animation:bob 1s infinite alternate}.shoulders{position:absolute;bottom:-18px;left:32px;width:186px;height:80px;border-radius:100px 100px 20px 20px;background:#506a93}
@keyframes talk{to{transform:scaleY(.55)}}@keyframes bob{to{transform:translateY(-4px)}}
.lesson-box{min-height:220px;background:#f7f9fc;border-radius:20px;padding:24px}.lesson-text{font-size:19px;line-height:1.7;white-space:pre-wrap}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.controls button,.controls select,.controls input{padding:12px 15px;border-radius:12px;border:1px solid #d7dce5;background:#fff}.primary{background:#315efb!important;color:white;border:0!important;cursor:pointer}.status{margin-top:12px;font-size:14px;color:#657084}
@media(max-width:800px){.tutor-stage{grid-template-columns:1fr}.avatar{width:210px;height:210px}.face{transform:scale(.85);transform-origin:top left}.hair{transform:scale(.85);transform-origin:top left}.shoulders{transform:scale(.85);transform-origin:bottom left}}
</style></head>
<body><main class="face-shell"><a class="back-link" href="{{ url_for('home') }}">← Back</a><section class="face-card"><p class="eyebrow">V8 • AI FACE TUTOR</p><h1>Meet your AI Teacher 👨‍🏫</h1><p>Choose your grade and topic. Your tutor will explain it aloud and check your understanding.</p>
<div class="tutor-stage"><div class="avatar-wrap"><div id="avatar" class="avatar"><div class="hair"></div><div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span></div><div class="shoulders"></div></div><div id="status" class="status">Ready to teach</div></div>
<div><div class="controls"><select id="grade">{% for g in range(1,13) %}<option value="{{g}}" {% if g==7 %}selected{% endif %}>Grade {{g}}</option>{% endfor %}</select><select id="subject"><option>Science</option><option>Maths</option><option>English</option><option>French</option><option>Social Science</option><option>Computer</option></select><input id="topic" placeholder="Topic, e.g. Water Cycle" style="flex:1;min-width:210px"><button class="primary" onclick="startLesson()">▶ Start Teaching</button></div>
<div class="lesson-box" style="margin-top:18px"><div id="lesson" class="lesson-text">Hi! I'm your Study Buddy teacher. Pick a topic and I'll teach it step by step.</div></div>
<div class="controls"><button onclick="speakCurrent()">🔊 Speak</button><button onclick="stopSpeaking()">⏹ Stop</button><button onclick="askNext()">🙋 Explain More</button></div></div></div></section></main>
<script>
let currentText='';
const avatar=document.getElementById('avatar'),statusEl=document.getElementById('status'),lesson=document.getElementById('lesson');
function speak(text){if(!text)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.94; u.pitch=1.02; u.onstart=()=>{avatar.classList.add('speaking');statusEl.textContent='Teaching… 🔊'};u.onend=()=>{avatar.classList.remove('speaking');statusEl.textContent='Ready for your question'};u.onerror=()=>{avatar.classList.remove('speaking');statusEl.textContent='Voice unavailable — you can still read the lesson'};speechSynthesis.speak(u)}
function speakCurrent(){speak(currentText)} function stopSpeaking(){speechSynthesis.cancel();avatar.classList.remove('speaking');statusEl.textContent='Paused'}
async function call(url,body){statusEl.textContent='Preparing your lesson…';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
async function startLesson(){const topic=document.getElementById('topic').value.trim();if(!topic){alert('Enter a topic first.');return}try{const d=await call('/api/ai-face/lesson',{grade:document.getElementById('grade').value,subject:document.getElementById('subject').value,topic});currentText=d.answer;lesson.textContent=currentText;speak(currentText)}catch(e){statusEl.textContent=e.message;lesson.textContent=e.message}}
async function askNext(){if(!currentText){return startLesson()}try{const d=await call('/api/ai-face/teach',{grade:document.getElementById('grade').value,subject:document.getElementById('subject').value,prompt:'Explain the lesson topic more deeply, using a different simple example, then ask me one question to check my understanding.'});currentText=d.answer;lesson.textContent=currentText;speak(currentText)}catch(e){statusEl.textContent=e.message}}
</script></body></html>
