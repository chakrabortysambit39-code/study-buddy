<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Tutor • Study Buddy</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="quiz-shell"><a class="back-link" href="{{ url_for('home') }}">← Back to Study Buddy</a><section class="hero-card"><p class="eyebrow">V7 • AI STUDY TUTOR</p><h1>Ask Study Buddy 🤖</h1><p>Type your question or use your browser's voice input.</p><form method="POST" class="ai-form"><textarea id="prompt" name="prompt" placeholder="Example: Explain photosynthesis in simple words..." required>{{ prompt }}</textarea><div class="hero-actions"><button class="secondary-button" type="button" id="voiceBtn">🎤 Speak</button><button class="primary-button" type="submit">Ask AI →</button></div></form></section>{% if answer %}<section class="question-card ai-answer"><div class="question-number">STUDY BUDDY</div><div class="answer-text" id="answer">{{ answer }}</div><button class="secondary-button" type="button" id="readBtn">🔊 Read Answer</button></section>{% endif %}<script>const promptBox=document.getElementById('prompt');const voiceBtn=document.getElementById('voiceBtn');if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new R();r.lang='en-IN';r.onresult=e=>promptBox.value=e.results[0][0].transcript;voiceBtn.onclick=()=>{voiceBtn.textContent='🎤 Listening...';r.start();r.onend=()=>voiceBtn.textContent='🎤 Speak';};}else{voiceBtn.disabled=true;voiceBtn.textContent='🎤 Voice unavailable';}const readBtn=document.getElementById('readBtn');if(readBtn){readBtn.onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('answer').innerText));};}</script></main></body></html>
