<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login • Study Buddy</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><main class="quiz-shell"><a class="back-link" href="{{ url_for('home') }}">← Back</a><section class="hero-card"><p class="eyebrow">V5 • ACCOUNT</p><h1>Welcome back 👋</h1><p>Log in to access your private notes and progress.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="error-card question-card">{{ message }}</div>{% endfor %}{% endwith %}<form method="POST" class="generator-grid"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="primary-button" type="submit">Log in →</button></form><p>New here? <a href="{{ url_for('register') }}">Create an account</a></p></section></main></body></html>
