<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Learning • Study Buddy</title><style>
:root{--bg:#f6f7ff;--card:#fff;--text:#182033;--muted:#69738a;--line:#e5e7f2;--purple:#6257ff;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#ebe7ff,#f6f7ff 42%);font-family:Inter,system-ui,Arial;color:var(--text)}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;font-size:21px}.back{padding:10px 15px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text);background:#fff}.hero{margin-bottom:22px}.eyebrow{font-size:12px;font-weight:900;color:var(--purple);letter-spacing:.12em}.hero h1{font-size:42px;line-height:1.05;margin:8px 0}.hero p{color:var(--muted);max-width:680px}.setup,.lesson{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(45,38,100,.08)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field select,.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:14px}.start{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#6d5cff,#7c3aed);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.hidden{display:none!important}.lesson-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.badge{padding:7px 10px;border-radius:999px;background:#eeeaff;color:#5549e9;font-weight:900;font-size:12px}.progress{height:9px;background:#eceef7;border-radius:20px;overflow:hidden;margin:16px 0}.bar{height:100%;width:20%;background:linear-gradient(90deg,#6257ff,#8b5cf6);transition:.3s}.step-nav{display:flex;gap:8px;overflow:auto;margin:15px 0}.step{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}.step.active{background:#eeeaff;color:#5549e9;border-color:#d8d2ff;font-weight:900}.content{background:#f8f8ff;border:1px solid #e8e6ff;border-radius:16px;padding:20px;margin-top:12px;line-height:1.65}.question{font-weight:900;margin:20px 0 8px}.answer{width:100%;min-height:90px;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;resize:vertical}.actions{display:flex;gap:10px;margin-top:12px}.actions button{padding:12px 16px;border:0;border-radius:11px;font-weight:900;cursor:pointer}.check{background:#182033;color:#fff}.next{background:#6257ff;color:#fff}.feedback{margin-top:14px;padding:14px;border-radius:13px;background:#f4f5fb}.feedback.good{border:1px solid #bbf7d0;background:#f0fdf4}.feedback.retry{border:1px solid #fecaca;background:#fff7f7}.tip{color:var(--muted);font-size:13px;margin-top:7px}.score{font-size:30px;font-weight:950}.error{color:#b91c1c;margin-top:10px}.done{padding:22px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;margin-top:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}.shell{padding:18px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">🧠 Study Buddy</div><a class="back" href="{{ url_for('home') }}">← Home</a></header><section class="hero"><div class="eyebrow">V9 • ADAPTIVE LEARNING ENGINE</div><h1>It teaches you based on your answers.</h1><p>Study Buddy now changes the lesson when you struggle, advances when you understand, and gives you a targeted next question.</p></section><section id="setup" class="setup"><div class="grid"><div class="field"><label>Grade</label><select id="grade">{% for g in range(1,13) %}<option value="{{g}}" {% if g==7 %}selected{% endif %}>Grade {{g}}</option>{% endfor %}</select></div><div class="field"><label>Subject</label><select id="subject"><option>Science</option><option>Maths</option><option>English</option><option>French</option><option>Social Science</option><option>Computer</option></select></div><div class="field"><label>Topic</label><input id="topic" placeholder="e.g. Water Cycle"></div></div><button class="start" onclick="startAdaptive()">🧠 Start Adaptive Lesson</button><div id="error" class="error"></div></section><section id="lesson" class="lesson hidden"><div class="lesson-head"><div><div class="eyebrow">LIVE LESSON</div><h2 id="title" style="margin:5px 0"></h2></div><span id="level" class="badge">Starter</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="steps" class="step-nav"></div><div class="content"><h2 id="heading"></h2><p id="content"></p><div class="question">🧠 Your turn</div><div id="question"></div><textarea id="answer" class="answer" placeholder="Type your answer here..."></textarea><div class="actions"><button class="check" onclick="checkAnswer()">✓ Check My Answer</button><button id="nextBtn" class="next hidden" onclick="advance()">Next →</button></div><div id="feedback" class="feedback hidden"></div></div></section></main><script>
let lesson=null,index=0;const $=id=>document.getElementById(id);function payload(){return{grade:$('grade').value,subject:$('subject').value,topic:$('topic').value.trim()}}function showStep(){const s=lesson.steps[index];$('heading').textContent=s.heading;$('content').textContent=s.content;$('question').textContent=s.question;$('answer').value='';$('feedback').className='feedback hidden';$('nextBtn').classList.add('hidden');$('bar').style.width=((index+1)/lesson.steps.length*100)+'%';[...$('steps').children].forEach((x,i)=>x.classList.toggle('active',i===index))}async function startAdaptive(){const p=payload();if(!p.topic){$('error').textContent='Enter a topic first.';return}$('error').textContent='';try{const r=await fetch('/api/adaptive/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json();if(!r.ok)throw Error(d.error);lesson=d;index=0;$('setup').classList.add('hidden');$('lesson').classList.remove('hidden');$('title').textContent=d.title;$('level').textContent=d.level;d.steps.forEach((s,i)=>{const x=document.createElement('div');x.className='step';x.textContent=(i+1)+'. '+s.heading;$('steps').appendChild(x)});showStep()}catch(e){$('error').textContent=e.message||'Could not start lesson.'}}async function checkAnswer(){const answer=$('answer').value.trim();if(!answer)return;const s=lesson.steps[index];try{const r=await fetch('/api/adaptive/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload(),question:s.question,answer})}),d=await r.json();if(!r.ok)throw Error(d.error);const f=$('feedback');f.className='feedback '+(d.correct?'good':'retry');f.innerHTML='<div class="score">'+d.score+'/100</div><b>'+(d.correct?'✅ Correct':'🔄 Let’s improve that')+'</b><div style="margin-top:6px">'+d.feedback+'</div><div class="tip">💡 '+d.teaching_tip+'</div>';if(d.correct||d.next_action==='advance')$('nextBtn').classList.remove('hidden')}catch(e){$('error').textContent=e.message}}function advance(){if(index<lesson.steps.length-1){index++;showStep()}else{$('lesson').innerHTML='<div class="done"><h2>🎉 Adaptive lesson complete!</h2><p>You finished all five stages. Now you can use the AI Face Tutor or generate a quiz on this topic.</p><a class="back" href="/ai-face">👨‍🏫 Continue with AI Face Tutor</a></div>'}}
</script></body></html>
